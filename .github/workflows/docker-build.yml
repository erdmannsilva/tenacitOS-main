name: Docker Build and Publish

on:
  push:
    branches: [ "main", "master" ]
  # Permite rodar o workflow manualmente pelo painel do GitHub
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Nome da imagem deve ser estritamente minúsculo para o Docker não dar erro
  IMAGE_NAME: erdmannsilva/tenacitos-main

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Otimização de cache do GitHub Actions para deixar os próximos builds super rápidos
          cache-from: type=gha
          cache-to: type=gha,mode=max
